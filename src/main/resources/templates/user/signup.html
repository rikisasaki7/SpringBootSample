<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Link to the CSS file for styling -->
  <link rel="stylesheet" th:href="@{/css/signup.css}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">

  <!-- js -->
  <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}" defer></script>
  <title th:text="#{user.signup.title}"></title>
</head>

<body class="bg-light">
  <form id="signup-form" th:action="@{/user/signup}" method="post" class="form-signup mt-5" th:object="${signupForm}">
    <h2 class="text-center" th:text="#{user.signup.title}"></h2>

    <!-- グローバルエラー -->
    <div th:if="${#fields.hasGlobalErrors()}">
      <p class="text-danger" th:each="error:${#fields.globalErrors()}" th:text="${error}">
      </p>
    </div>

    <!-- 入力値 -->
    <div class="form-group">
      <label for="userId" th:text="#{userId}"></label>
      <input type="text" class="form-control" id="userId" th:field="*{userId}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{userId}"></div>
    </div>
    <div class="form-group">
      <label for="password" th:text="#{password}"></label>
      <input type="text" class="form-control" id="password" th:field="*{password}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{password}"></div>
    </div>
    <div class="form-group">
      <label for="userName" th:text="#{userName}"></label>
      <input type="text" class="form-control" id="userName" th:field="*{userName}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{userName}"></div>
    </div>
    <div class="form-group">
      <label for="birthday" th:text="#{birthday}"></label>
      <input type="text" class="form-control" id="birthday" placeholder="YYYY/MM/DD" th:field="*{birthday}"
        th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{birthday}"></div>
    </div>
    <div class="form-group">
      <label for="age" th:text="#{age}"></label>
      <input type="text" class="form-control" id="age" min="0" max="150" th:field="*{age}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{age}"></div>
    </div>
    <div class="form-group mt-2">
      <label class="me-3" th:text="#{gender}"></label>
      <div th:each="item:${genderMap}" class="form-check-inline">
        <input type="radio" class="form-check-input" th:value="${item.value}" th:field="*{gender}"
          th:errorclass="is-invalid">
        <label class="form-check-label" th:text="${item.key}"></label>
      </div>
      <div class="text-danger" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
    </div>

    <!-- 登録ボタン -->
    <input type="submit" th:value="#{user.signup.btn}" class="btn btn-primary w-100 mt-4">

    <!-- ログイン画面へのリンク -->
    <div class="text-center mt-2">
      <a th:href="@{/login}" th:text="#{link.login}"></a>
    </div>
  </form>
</body>

</html>
