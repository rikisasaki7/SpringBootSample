<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Link to the CSS file for styling -->
  <link rel="stylesheet" th:href="@{/css/signup.css}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">

  <!-- js -->
  <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}" defer></script>
  <title th:text="#{user.signup.title}"></title>
</head>

<body class="bg-light">
  <!-- わざとth:actionは使わず、actionを使って違いを比較できるようにするらしい -->
  <form id="signup-form" action="@{/user/signup}" method="post" class="form-signup mt-5">
    <h2 class="text-center" th:text="#{user.signup.title}"></h2>
    <div class="form-group">
      <label for="userId" th:text="#{userId}"></label>
      <input type="text" class="form-control" id="userId">
    </div>
    <div class="form-group">
      <label for="password" th:text="#{password}"></label>
      <input type="text" class="form-control" id="password">
    </div>
    <div class="form-group">
      <label for="birthday" th:text="#{birthday}"></label>
      <input type="text" class="form-control" id="birthday" placeholder="YYYY/MM/DD">
    </div>
    <div class="form-group">
      <label for="age" th:text="#{age}"></label>
      <input type="number" class="form-control" id="age" min="0" max="150">
    </div>
    <div class="form-group mt-2">
      <label class="me-3" th:text="#{gender}"></label>
      <div th:each="item:${genderMap}" class="form-check-inline">
        <input type="radio" class="form-check-input" th:value="${item.value}">
        <label class="form-check-label" th:text="${item.key}"></label>
      </div>
    </div>
    <input type="submit" th:value="#{user.signup.btn}" class="btn btn-primary w-100 mt-4">
    <div class="text-center mt-2">
      <a th:href="@{/login}" th:text="#{link.login}"></a>
    </div>
  </form>
</body>

</html>
