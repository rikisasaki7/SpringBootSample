<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0 shrink-to-fit=no">

  <!-- Link to the CSS file for styling -->
  <link rel="stylesheet" th:href="@{/css/layout.css}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">

  <!-- js -->
  <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}" defer></script>
  <title>Layout</title>
</head>

<body>
  <!-- ヘッダー -->
  <nav layout:replace="~{layout/header::header-contents}"></nav>
  <!-- メニュー -->
  <div class="container-fluid">
    <div class="row">
      <nav class="col-sm-2 h-100 bg-light sidebar pt-2">
        <div class="bg-light" layout:insert="~{layout/menu::menu-contents}"></div>
      </nav>
    </div>
  </div>
  <!-- メインコンテンツ -->
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-10 offset-sm-2 main">
        <div layout:fragment="content"></div>
      </div>
    </div>
  </div>
</body>

</html>
