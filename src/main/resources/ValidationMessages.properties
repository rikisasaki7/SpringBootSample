# パターン１ form指定
typeMismatch.signupForm.age=年齢は整数で入力してください
typeMismatch.signupForm.birthday=誕生日はYYYY/MM/DD形式で入力してください

# パターン２ フィールド指定
#typeMismatch.age=年齢は整数で入力してください
#typeMismatch.birthday=誕生日はYYYY/MM/DD形式で入力してください

# パターン３ クラス指定
#typeMismatch.java.lang.Integer=年齢は整数で入力してください
#typeMismatch.java.util.Date=誕生日はYYYY/MM/DD形式で入力してください

# バリデーションエラーメッセージ
NotBlank={0}は必須Blankです
NotEmpty={0}は必須Emptyです
Email={0}はメールアドレス形式で入力してください
Length={0}は{2}桁以上、{1}桁以下で入力してください
Pattern={0}は半角英数字
NotNull={0}は必須Nullです
Min={0}は{1}以上で入力してください
Max={0}は{1}以下で入力してください

length.min.message={1}文字以上の{0}を入力してください
birthday.age.message=誕生日と年齢があっていないです